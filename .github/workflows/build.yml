name: Build Cave Tribe

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        shell: bash
        run: set -o pipefail; npm install 2>&1 | tee install.log
      - name: Typecheck
        shell: bash
        run: set -o pipefail; npm run typecheck 2>&1 | tee typecheck.log
      - name: Test
        shell: bash
        run: set -o pipefail; npm run test 2>&1 | tee test.log
      - name: Build standalone HTML
        shell: bash
        run: set -o pipefail; npm run build 2>&1 | tee build.log
      - name: Upload CI logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Cave-Tribe-v0.1.1-CI-logs
          path: '*.log'
          if-no-files-found: warn
      - name: Upload standalone HTML
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Cave-Tribe-v0.1.1-PLAY
          path: dist/Cave-Tribe-v0.1.1-PLAY.html
          if-no-files-found: error
