name: Build Cave Tribe

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Test and build
        run: npm run check && npm run build
      - name: Upload standalone HTML
        uses: actions/upload-artifact@v4
        with:
          name: Cave-Tribe-v0.1.1-PLAY
          path: dist/Cave-Tribe-v0.1.1-PLAY.html
          if-no-files-found: error
